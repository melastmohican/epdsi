name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (full CI matrix)
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish to crates.io and GitHub
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # Required for crates.io Trusted Publishing (OIDC token exchange).
      id-token: write
      # Required to create the GitHub Release.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Enable caching
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "epdsi") | .version')"
          echo "tag=$tag_version crate=$crate_version"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi

      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "body<<CHANGELOG_EOF"
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]"  { capture = 1; next }
              capture && /^## \[/        { exit }
              capture && /^\[[^]]+\]: /  { exit }
              capture                    { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Package dry run
        run: cargo publish --dry-run

      - name: Check whether this version is already on crates.io
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          name=epdsi
          # Sparse-index layout: 1-char -> 1/<name>, 2 -> 2/<name>,
          # 3 -> 3/<first>/<name>, 4+ -> <first two>/<next two>/<name>.
          # Queried directly because `cargo info` resolves the *local*
          # package when run inside the crate, which would always report
          # "already published" and silently disable publishing.
          case ${#name} in
            1) path="1/$name" ;;
            2) path="2/$name" ;;
            3) path="3/${name:0:1}/$name" ;;
            *) path="${name:0:2}/${name:2:2}/$name" ;;
          esac
          code="$(curl -sS -o index.json -w '%{http_code}' "https://index.crates.io/$path")"
          case "$code" in
            404)
              echo "Crate is not in the index yet; publishing."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              if jq -e --arg v "$version" 'select(.vers == $v)' index.json > /dev/null; then
                echo "::notice::$name $version is already on crates.io; skipping publish."
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "$name $version is not on crates.io; publishing."
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error::Unexpected HTTP $code from the crates.io index"
              exit 1
              ;;
          esac
          rm -f index.json

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        if: steps.published.outputs.skip == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false

      - name: Post release announcement to Mastodon
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          crate_url="https://crates.io/crates/epdsi"
          header="epdsi v${version} released 🎉"

          # First sentence of each changelog bullet (wrapped lines joined), one per line.
          summary="$(printf '%s\n' "$CHANGELOG_BODY" | awk '
            /^- /      { if (cur != "") print cur; cur = substr($0, 3); next }
            /^  /      { if (cur != "") { sub(/^ +/, ""); cur = cur " " $0 } ; next }
            /^$|^#/    { if (cur != "") print cur; cur = ""; next }
            END        { if (cur != "") print cur }
          ' | awk '{ i = index($0, ". "); if (i > 0) $0 = substr($0, 1, i); print "- " $0 }')"

          # Mastodon caps a post at 500 characters and counts each URL as 23, whatever its
          # length. Keep a margin. Drop whole trailing bullets first; only if a single bullet
          # is still too long, cut it back to a word boundary rather than mid-word.
          limit=$(( 490 - ${#header} - 2 * 23 - 8 ))
          while [ "${#summary}" -gt "$limit" ] && [[ "$summary" == *$'\n'* ]]; do
            summary="${summary%$'\n'*}"
          done
          if [ "${#summary}" -gt "$limit" ]; then
            summary="${summary:0:$limit}"
            summary="${summary% *}…"
          fi

          status="${header}"$'\n\n'
          if [ -n "$summary" ]; then
            status="${status}${summary}"$'\n\n'
          fi
          status="${status}${release_url}"$'\n'"${crate_url}"

          # curl exits 0 on an HTTP 4xx, so check the status code explicitly; otherwise a
          # rejected post (as happened with the 500-character limit) still shows as green.
          code="$(curl -sS -o mastodon.json -w '%{http_code}' -X POST \
            "https://fosstodon.org/api/v1/statuses" \
            -H "Authorization: Bearer ${MASTODON_ACCESS_TOKEN}" \
            --data-urlencode "status=${status}" \
            --data-urlencode "visibility=public")"
          if [ "$code" != "200" ]; then
            echo "::error::Mastodon returned HTTP ${code}: $(cat mastodon.json)"
            exit 1
          fi
          echo "Posted: $(jq -r .url mastodon.json)"
