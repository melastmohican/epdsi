name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: check
            args: --all-targets
          - command: check
            args: --no-default-features
          - command: check
            args: --features defmt
          - command: test
            args: --workspace
          - command: clippy
            args: --all-features --workspace -- -D warnings
          - command: doc
            args: --no-deps --all-features
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          # Must match `rust-version` in Cargo.toml.
          toolchain: "1.75"
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Drop lockfile
        # The committed Cargo.lock is format v4, which Cargo 1.75 cannot parse.
        # Resolving fresh here also mirrors what a consumer on the MSRV would get.
        run: rm -f Cargo.lock
      - name: Check library
        run: cargo check --all-features

  build-targets:
    name: Build for Targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv6m-none-eabi             # RP2040 (Cortex-M0+)
          - thumbv7em-none-eabihf          # STM32/Cortex-M4F
          - riscv32imac-unknown-none-elf    # ESP32-C3/C6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Build library
        run: cargo check --target ${{ matrix.target }}
